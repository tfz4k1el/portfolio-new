<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Wordle — Hafiz Yoosuf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    @keyframes pf-in{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
    @keyframes pf-tile{ from{ opacity:0; transform:scale(0.6); } to{ opacity:1; transform:scale(1); } }
    @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; animation-delay:0ms !important; transition-duration:0.01ms !important; } }
    [data-tile]{ border-radius:3px; opacity:0; animation:pf-tile 380ms cubic-bezier(0.16,1,0.3,1) forwards; }
    @media (max-width: 640px){ [data-el="page"]{ padding:18px 20px !important; } }
  </style>
</helmet>
<div data-screen-label="Wordle" data-el="page" ref="{{ pageRef }}" style="position:relative; width:100%; min-height:100vh; background:#ffffff; display:flex; flex-direction:column; padding:18px 32px; font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">

  <div style="display:flex; align-items:center; padding:4px 0; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 0ms forwards;">
    <a href="Portfolio.dc.html" style="font-family:'Geist',sans-serif; font-weight:700; font-size:20px; line-height:100%; color:#000; text-decoration:none;" style-hover="opacity:0.5;">Hafiz Yoosuf</a>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding-bottom:56px;">
    <span style="font-family:'Geist Mono',ui-monospace,monospace; font-weight:500; font-size:14px; line-height:100%; letter-spacing:0.08em; color:#454545; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 80ms forwards;">WORDLE</span>
    <div style="display:flex; flex-direction:column; align-items:center; gap:20px;">
      <span style="font-family:'Geist',sans-serif; font-weight:600; font-size:20px; line-height:100%; color:#000; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 160ms forwards;">Wordle {{ puzzle }} {{ score }}</span>
      {{ tileGrid }}
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Tile colors — g=green, y=yellow, b=black(absent)
const TILE_COLORS = { g: "#6aaa64", y: "#c9b458", b: "#1a1a1a" };
const WD_KEY = "wordle_data";
const WD_API = "https://z4ffy--2b4917f477ec11f1bd2f1607ee4eb77e.web.val.run";
// ── Webhook shape ─────────────────────────────────────────────────────────────
// POST this JSON to your API, then write it to localStorage[WD_KEY]:
// { "puzzle": "1,840", "score": "5/6",
//   "rows": [["y","b","b","y","b"], ["g","b","b","y","b"], ...] }
// ─────────────────────────────────────────────────────────────────────────────

const DEFAULT_DATA = {
  puzzle: "1,840", score: "5/6",
  rows: [
    ["y","b","b","y","b"],
    ["g","b","b","y","b"],
    ["b","b","b","b","y"],
    ["g","b","y","y","y"],
    ["g","g","g","g","g"]
  ]
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.pageRef = React.createRef();
    let data = DEFAULT_DATA;
    try {
      const s = JSON.parse(localStorage.getItem(WD_KEY));
      if (s && Array.isArray(s.rows)) data = s;
    } catch(e) {}
    this.state = { data };
  }

  componentDidMount() {
    this.onLinkClick = (e) => {
      const a = e.target.closest && e.target.closest("a[href]");
      if (!a || a.target === "_blank" || e.defaultPrevented) return;
      const href = a.getAttribute("href");
      if (!href || href.startsWith("#") || !href.includes(".html")) return;
      e.preventDefault();
      const el = this.pageRef.current || document.body;
      el.style.transition = "opacity 260ms ease";
      el.style.opacity = "0";
      setTimeout(() => { window.location.href = href; }, 270);
    };
    document.addEventListener("click", this.onLinkClick);
    // Auto-update when the API writes new data to localStorage (cross-tab)
    this.onStorage = (e) => {
      if (e.key !== WD_KEY) return;
      try {
        const s = JSON.parse(e.newValue);
        if (s && Array.isArray(s.rows)) this.setState({ data: s });
      } catch(err) {}
    };
    window.addEventListener("storage", this.onStorage);
    // If an API endpoint is configured, fetch the latest result and cache it.
    if (WD_API) {
      fetch(WD_API)
        .then((r) => r.json())
        .then((s) => {
          if (s && s.record) s = s.record; // unwrap jsonbin.io-style responses
          if (!s || !Array.isArray(s.rows)) return;
          try { localStorage.setItem(WD_KEY, JSON.stringify(s)); } catch(e) {}
          this.setState({ data: s });
        })
        .catch(() => {});
    }
  }

  componentWillUnmount() {
    document.removeEventListener("click", this.onLinkClick);
    window.removeEventListener("storage", this.onStorage);
  }

  renderVals() {
    const { data } = this.state;
    const tileGrid = React.createElement(
      "div",
      { style: { display: "grid", gridTemplateColumns: "repeat(5, 44px)", gridAutoRows: "44px", gap: "8px" } },
      ...data.rows.flatMap((row, ri) =>
        row.map((c, ci) =>
          React.createElement("div", {
            key: ri * 5 + ci,
            "data-tile": "",
            style: {
              borderRadius: 3,
              background: TILE_COLORS[c] || "#1a1a1a",
              animationDelay: (240 + (ri * 5 + ci) * 35) + "ms"
            }
          })
        )
      )
    );
    return { pageRef: this.pageRef, puzzle: data.puzzle, score: data.score, tileGrid };
  }
}
</script>
</body>
</html>
