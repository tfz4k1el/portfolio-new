<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <title>Guestbook — Hafiz Yoosuf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    @keyframes pf-in{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
    @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; animation-delay:0ms !important; transition-duration:0.01ms !important; } }
    [data-el="page"] input::placeholder, [data-el="page"] textarea::placeholder{ color:#8a8a8a; opacity:1; }
    @media (max-width: 640px){
      [data-el="page"]{ padding:18px 20px 48px !important; }
    }
  </style>
</helmet>
<div data-screen-label="Guestbook" data-el="page" ref="{{ pageRef }}" style="position:relative; width:100%; min-height:100vh; background:#ffffff; display:flex; flex-direction:column; padding:18px 32px 64px; font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#000;">

  <div style="display:flex; align-items:center; padding:4px 0; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 0ms forwards;">
    <a href="Portfolio.dc.html" style="font-family:'Geist',sans-serif; font-weight:700; font-size:20px; line-height:100%; color:#000; text-decoration:none; transition:opacity 150ms;" style-hover="opacity:0.5;">Hafiz Yoosuf</a>
  </div>

  <div style="padding:28px 0 16px; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 80ms forwards;">
    <span style="font-family:'Geist Mono',ui-monospace,monospace; font-weight:500; font-size:14px; line-height:100%; letter-spacing:0.08em; color:#454545;">GUESTBOOK</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:44px; max-width:560px; width:100%;">

    <div style="display:flex; flex-direction:column; gap:10px; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 160ms forwards;">
      <input value="{{ name }}" onChange="{{ onName }}" placeholder="Name" style="width:100%; border:1px solid #e3e3e1; border-radius:3px; padding:12px 14px; font-family:'Geist',sans-serif; font-weight:500; font-size:15px; line-height:100%; color:#000; background:#fff; outline:none;" style-focus="border-color:#000;"></input>
      <textarea value="{{ message }}" onChange="{{ onMessage }}" placeholder="Leave a note" rows="3" style="width:100%; border:1px solid #e3e3e1; border-radius:3px; padding:12px 14px; font-family:'Geist',sans-serif; font-weight:500; font-size:15px; line-height:145%; color:#000; background:#fff; outline:none; resize:vertical;" style-focus="border-color:#000;"></textarea>
      <button onClick="{{ sign }}" style="align-self:flex-start; margin-top:4px; background:#000; color:#fff; border:none; border-radius:999px; padding:12px 18px; font-family:'Geist Mono',ui-monospace,monospace; font-weight:500; font-size:12px; line-height:100%; letter-spacing:0.08em; cursor:pointer;" style-hover="opacity:0.75;">SIGN GUESTBOOK</button>
    </div>

    <div style="display:flex; flex-direction:column; gap:28px; opacity:0; animation:pf-in 700ms cubic-bezier(0.16,1,0.3,1) 240ms forwards;">
      <sc-for list="{{ entries }}" as="entry" hint-placeholder-count="1">
        <div style="display:flex; flex-direction:column; gap:6px; animation:pf-in 500ms cubic-bezier(0.16,1,0.3,1);">
          <div style="display:flex; align-items:baseline; gap:10px;">
            <span style="font-family:'Geist',sans-serif; font-weight:600; font-size:15px; line-height:100%; color:#000;">{{ entry.name }}</span>
            <span style="font-family:'Geist Mono',ui-monospace,monospace; font-weight:500; font-size:12px; line-height:100%; letter-spacing:0.08em; color:#8a8a8a;">{{ entry.date }}</span>
          </div>
          <span style="font-family:'Geist',sans-serif; font-weight:400; font-size:15px; line-height:145%; color:#333; text-wrap:pretty;">{{ entry.message }}</span>
        </div>
      </sc-for>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const GB_KEY = "guestbook_v1";
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.pageRef = React.createRef();
    let _stored = [];
    try { _stored = JSON.parse(localStorage.getItem(GB_KEY)); } catch(e) {}
    this.state = {
      name: "",
      message: "",
      entries: Array.isArray(_stored) && _stored.length ? _stored : [
        { name: "Hafiz Yoosuf", date: "JUL 4, 2026", message: "Signed my own guestbook to make sure it works." },
      ],
    };
  }

  componentDidMount() {
    // Intercept internal page links so navigation gets a fade-out transition.
    this.onLinkClick = (e) => {
      const a = e.target.closest && e.target.closest("a[href]");
      if (!a || a.target === "_blank" || e.defaultPrevented) return;
      const href = a.getAttribute("href");
      if (!href || href.startsWith("#") || href.startsWith("mailto:") || !href.includes(".html")) return;
      e.preventDefault();
      const el = this.pageRef.current || document.body;
      el.style.transition = "opacity 260ms ease";
      el.style.opacity = "0";
      setTimeout(() => { window.location.href = href; }, 270);
    };
    document.addEventListener("click", this.onLinkClick);
  }

  componentWillUnmount() {
    document.removeEventListener("click", this.onLinkClick);
  }

  renderVals() {
    const fmtDate = () => {
      const m = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
      const d = new Date();
      return m[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
    };
    return {
      pageRef: this.pageRef,
      name: this.state.name,
      message: this.state.message,
      entries: this.state.entries,
      onName: (e) => this.setState({ name: e.target.value }),
      onMessage: (e) => this.setState({ message: e.target.value }),
      sign: () => {
        const n = this.state.name.trim();
        const msg = this.state.message.trim();
        if (!n || !msg) return;
        const _entries = [{ name: n, date: fmtDate(), message: msg }, ...this.state.entries];
        try { localStorage.setItem(GB_KEY, JSON.stringify(_entries)); } catch(e) {}
        this.setState({ entries: _entries, name: "", message: "" });
      },
    };
  }
}
</script>
</body>
</html>
